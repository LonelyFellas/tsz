packages:
  - "apps/*"
  - "packages/*"
# 本地构建的 standalone 同时需要 tshb-test 的 Linux x64 原生依赖。
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
# 安全公告对应的定向覆盖；上游依赖更新后复查并移除。
overrides:
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "browserslist@<4.28.7": "4.28.7"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  "source-map-js@<1.2.2": "1.2.2"
  "zod@>=4.0.0 <4.6.6": "4.6.7"
patchedDependencies:
  "@rc-component/util@1.12.0": patches/@rc-component__util@1.12.0.patch
