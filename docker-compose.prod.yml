# Production compose for the frontend tier (web + admin + nginx) on the app ECS.
# The Rust API runs from the backend repository's production compose and joins
# the shared `tsz-prod-edge` Docker network. Nginx reaches it by service name.
#
# ALB → host:8080 → nginx container:80:
#   /api/v1/* → Rust API :8383   (same-origin, so no CORS)
#   /*        → web (Next SSR) / admin (static SPA) by subdomain
# Before starting this stack, run ./deploy/ensure-docker-network.sh. The Rust
# backend compose must run on the same Docker host and join this network too.
# nginx (not the apps) proxies the API so the images stay backend-address-agnostic
# — see deploy/nginx/conf.d/tsz.conf. admin ships as a static Vite bundle served
# by its own nginx (apps/admin/Dockerfile); web stays a Next SSR node service.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - edge
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    # 静态 SPA 由容器内 nginx 固定监听 :3001（见 apps/admin/deploy/nginx.conf），
    # 无需 PORT 环境变量。
    expose:
      - "3001"
    networks:
      - edge
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - admin
    ports:
      - "8080:80"
      # 443 is wired once a TLS cert exists — see deploy/nginx/ and the README.
      # - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro   # mount certs for 443
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    name: tsz-prod-edge
    external: true
