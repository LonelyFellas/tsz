name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动补跑入口:main 的 push 事件偶发没触发 CI 时(#270 合并后遇到过),在 main 上手动跑一次;
  # 部署门禁按精确 SHA 认 CI 运行、不区分触发事件。缓存写入仍只认 push。
  workflow_dispatch:
    inputs:
      voice_editor:
        type: boolean
        default: true
      azure_pronunciation_inputs:
        type: boolean
        default: true
      form_spelling_regularity:
        type: boolean
        default: true
      sentence_formatting:
        type: boolean
        default: true

# 默认只给只读权限,按需在单个 job 内提权(最小权限,降低 token 被滥用的风险)。
permissions:
  contents: read

# PR 上新推送时取消进行中的旧任务；main 不取消正在运行的任务。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # Match tshb-test's glibc; standalone contains native Node dependencies.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Resolve turbo cache key
        id: turbo-key
        env:
          CACHE_KEY: turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package.json') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      # 仅恢复可信 main 保存的 Turbo archive；任务级命中仍由 Turbo 自身内容 hash 判定。
      - name: Restore turbo cache
        id: turbo-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ steps.turbo-key.outputs.value }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package.json') }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Record turbo cache
        run: >-
          node scripts/ci-metrics.mjs cache turbo
          "${{ steps.turbo-key.outputs.value }}"
          "${{ steps.turbo-cache.outputs.cache-matched-key }}"
          "${{ steps.turbo-cache.outputs.cache-hit }}"
          "${{ steps.turbo-cache.outcome }}"

      - name: Reset incomplete turbo restore
        if: steps.turbo-cache.outcome == 'failure'
        run: >-
          node -e 'require("node:fs").rmSync(".turbo", { recursive: true, force: true })'

      - name: Lint
        run: node scripts/ci-metrics.mjs run lint -- pnpm lint

      - name: Typecheck
        run: node scripts/ci-metrics.mjs run typecheck -- pnpm typecheck

      - name: Format check
        run: node scripts/ci-metrics.mjs run format -- pnpm format:check

      - name: Build
        if: github.ref != 'refs/heads/main' || github.repository != 'LonelyFellas/tsz'
        run: node scripts/ci-metrics.mjs run build -- pnpm build

      - name: Build and verify deployable packages
        if: github.ref == 'refs/heads/main' && github.repository == 'LonelyFellas/tsz'
        env:
          DEPLOY_VOICE_EDITOR: ${{ github.event_name == 'workflow_dispatch' && inputs.voice_editor || github.event_name != 'workflow_dispatch' }}
          DEPLOY_AZURE_PRONUNCIATION_INPUTS: ${{ github.event_name == 'workflow_dispatch' && inputs.azure_pronunciation_inputs || github.event_name != 'workflow_dispatch' }}
          DEPLOY_FORM_SPELLING_REGULARITY: ${{ github.event_name == 'workflow_dispatch' && inputs.form_spelling_regularity || github.event_name != 'workflow_dispatch' }}
          DEPLOY_SENTENCE_FORMATTING: ${{ github.event_name == 'workflow_dispatch' && inputs.sentence_formatting || github.event_name != 'workflow_dispatch' }}
        run: |
          mkdir -p "$RUNNER_TEMP/releases"
          node scripts/ci-metrics.mjs run build-web -- node deploy/release-artifact.mjs build web "$PWD" "$RUNNER_TEMP/releases/web"
          node scripts/ci-metrics.mjs run build-admin -- node deploy/release-artifact.mjs build admin "$PWD" "$RUNNER_TEMP/releases/admin"

      - name: Upload Web release
        if: github.ref == 'refs/heads/main' && github.repository == 'LonelyFellas/tsz'
        uses: actions/upload-artifact@v7
        with:
          name: tsz-web-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/releases/web/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Admin release
        if: github.ref == 'refs/heads/main' && github.repository == 'LonelyFellas/tsz'
        uses: actions/upload-artifact@v7
        with:
          name: tsz-admin-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/releases/admin/
          if-no-files-found: error
          retention-days: 30

      - name: Save pnpm cache from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'LonelyFellas/tsz' &&
          steps.node-pnpm.outputs.restore-outcome == 'success' &&
          steps.node-pnpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.node-pnpm.outputs.store-path }}
          key: ${{ steps.node-pnpm.outputs.cache-key }}

      - name: Save turbo cache from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'LonelyFellas/tsz' &&
          steps.turbo-cache.outcome == 'success' &&
          steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ steps.turbo-key.outputs.value }}

  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Check Node runtime
        run: node scripts/ci-metrics.mjs run check-node -- pnpm check:node

      - name: Test Node runtime guard
        run: >-
          node scripts/ci-metrics.mjs run test-node-runtime --
          pnpm test:node-runtime

      - name: Test coverage lock
        run: >-
          node scripts/ci-metrics.mjs run test-coverage-lock --
          pnpm test:coverage-lock

      - name: Test CI modules and workflow
        run: >-
          node scripts/ci-metrics.mjs run test-ci-modules --
          pnpm test:ci-modules

      - name: Test OSS test-resource cleanup boundaries
        run: python3 -B -m unittest discover -s scripts -p 'test_cleanup_test_oss.py' -v

      - name: Test deploy provenance
        run: >-
          node scripts/ci-metrics.mjs run test-deploy-provenance --
          pnpm test:deploy-provenance

      - name: Validate frontend retention systemd units
        run: >-
          systemd-analyze verify
          deploy/systemd/tsz-frontend-retention.service
          deploy/systemd/tsz-frontend-retention.timer

      - name: Test release transaction with Nginx
        run: bash deploy/test-runtime/test.sh

  unit-coverage:
    name: unit-coverage (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: packages
          - module: web
          - module: admin-1
          - module: admin-2
          - module: admin-3
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      # PR 与 main 使用相同的覆盖率模式，避免合并后才暴露测试超时。
      - name: Run test module
        run: >-
          node scripts/ci-metrics.mjs run tests-${{ matrix.module }} --
          pnpm ci:test-module ${{ matrix.module }}
          .ci-artifacts/${{ matrix.module }}
          coverage

      - name: Measure coverage module artifact
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci-metrics.mjs artifact
          coverage-${{ matrix.module }} required
          .ci-artifacts/${{ matrix.module }}/.vitest-reports
          .ci-artifacts/${{ matrix.module }}/.ci-inventories

      # 名字带 run_attempt：同一 run 重跑后旧 attempt 的同名产物仍在，download-artifact
      # 按名去重时挑 artifact ID 最大的一份，而 ID 不随时间递增，会拿到旧结果。
      - name: Upload blob and actual-run inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.module }}-attempt-${{ github.run_attempt }}
          path: |
            .ci-artifacts/${{ matrix.module }}/.vitest-reports/
            .ci-artifacts/${{ matrix.module }}/.ci-inventories/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-merge:
    needs: unit-coverage
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      # 不合并下载，每份产物各占一个目录，再由脚本给每个模块挑最近一次 attempt。
      # 不能只收当前 attempt：只重跑失败任务时，没重跑的模块用的仍是之前 attempt 的产物。
      - name: Download coverage modules
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .ci-downloads

      - name: Select latest attempt of each coverage module
        run: >-
          node scripts/ci-metrics.mjs run collect-test-artifacts --
          pnpm ci:collect-test-artifacts .ci-downloads .ci-artifacts

      - name: Generate full test inventory
        run: >-
          node scripts/ci-metrics.mjs run full-test-inventory --
          sh -c 'pnpm exec vitest list --filesOnly --json > .ci-full-inventory.json'

      - name: Verify every test file ran exactly once
        run: >-
          node scripts/ci-metrics.mjs run validate-test-inventories --
          pnpm ci:validate-test-inventories .ci-full-inventory.json
          .ci-artifacts/.ci-inventories .ci-artifacts/.vitest-reports

      - name: Merge coverage report
        if: github.event_name != 'pull_request'
        run: >-
          node scripts/ci-metrics.mjs run merge-coverage --
          pnpm exec vitest --config=vitest.config.ts
          --merge-reports=.ci-artifacts/.vitest-reports --coverage

      - name: Measure failed coverage report
        if: ${{ !cancelled() && failure() }}
        run: >-
          node scripts/ci-metrics.mjs artifact coverage-report optional coverage/

      - name: Upload failed coverage report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [quality, tooling-tests, unit-coverage, coverage-merge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification dependency
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TOOLING_RESULT: ${{ needs['tooling-tests'].result }}
          UNIT_COVERAGE_RESULT: ${{ needs['unit-coverage'].result }}
          COVERAGE_MERGE_RESULT: ${{ needs['coverage-merge'].result }}
        run: |
          for result in "$QUALITY_RESULT" "$TOOLING_RESULT" "$UNIT_COVERAGE_RESULT" "$COVERAGE_MERGE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "verification dependency finished with: $result"
              exit 1
            fi
          done

  # 校验本次 PR 内所有提交是否符合 conventional commits(兜底本地 commit-msg 钩子被绕过的情况)。
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # push 到 main 时没有 PR 范围可校验,故只在 PR 上跑。
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint 需要 base..head 之间的完整提交历史。
          fetch-depth: 0

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >
          node scripts/ci-metrics.mjs run commitlint -- pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
