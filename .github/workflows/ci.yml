name: CI

on:
  push:
    branches: [main]
  pull_request:

# 默认只给只读权限,按需在单个 job 内提权(最小权限,降低 token 被滥用的风险)。
permissions:
  contents: read

# PR 上新推送时取消进行中的旧任务;但 main 不取消(避免取消接续部署的半成品构建)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Resolve turbo cache key
        id: turbo-key
        env:
          CACHE_KEY: turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package.json') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      # 仅恢复可信 main 保存的 Turbo archive；任务级命中仍由 Turbo 自身内容 hash 判定。
      - name: Restore turbo cache
        id: turbo-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ steps.turbo-key.outputs.value }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package.json') }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Record turbo cache
        run: >-
          node scripts/ci-metrics.mjs cache turbo
          "${{ steps.turbo-key.outputs.value }}"
          "${{ steps.turbo-cache.outputs.cache-matched-key }}"
          "${{ steps.turbo-cache.outputs.cache-hit }}"
          "${{ steps.turbo-cache.outcome }}"

      - name: Reset incomplete turbo restore
        if: steps.turbo-cache.outcome == 'failure'
        run: >-
          node -e 'require("node:fs").rmSync(".turbo", { recursive: true, force: true })'

      - name: Lint
        run: node scripts/ci-metrics.mjs run lint -- pnpm lint

      - name: Typecheck
        run: node scripts/ci-metrics.mjs run typecheck -- pnpm typecheck

      - name: Format check
        run: node scripts/ci-metrics.mjs run format -- pnpm format:check

      - name: Build
        run: node scripts/ci-metrics.mjs run build -- pnpm build

      - name: Save pnpm cache from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'LonelyFellas/tsz' &&
          steps.node-pnpm.outputs.restore-outcome == 'success' &&
          steps.node-pnpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.node-pnpm.outputs.store-path }}
          key: ${{ steps.node-pnpm.outputs.cache-key }}

      - name: Save turbo cache from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'LonelyFellas/tsz' &&
          steps.turbo-cache.outcome == 'success' &&
          steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ steps.turbo-key.outputs.value }}

  tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Check Node runtime
        run: node scripts/ci-metrics.mjs run check-node -- pnpm check:node

      - name: Test Node runtime guard
        run: >-
          node scripts/ci-metrics.mjs run test-node-runtime --
          pnpm test:node-runtime

      - name: Test coverage lock
        run: >-
          node scripts/ci-metrics.mjs run test-coverage-lock --
          pnpm test:coverage-lock

      - name: Test CI modules and workflow
        run: >-
          node scripts/ci-metrics.mjs run test-ci-modules --
          pnpm test:ci-modules

      - name: Test deploy provenance
        run: >-
          node scripts/ci-metrics.mjs run test-deploy-provenance --
          pnpm test:deploy-provenance

  unit-coverage:
    name: unit-coverage (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: packages
          - module: web
          - module: admin-1
          - module: admin-2
          - module: admin-3
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Run coverage module
        run: >-
          node scripts/ci-metrics.mjs run coverage-${{ matrix.module }} --
          pnpm ci:test-module ${{ matrix.module }}
          .ci-artifacts/${{ matrix.module }}

      - name: Measure coverage module artifact
        if: ${{ !cancelled() }}
        run: >-
          node scripts/ci-metrics.mjs artifact
          coverage-${{ matrix.module }} required
          .ci-artifacts/${{ matrix.module }}/.vitest-reports
          .ci-artifacts/${{ matrix.module }}/.ci-inventories

      - name: Upload blob and actual-run inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.module }}
          path: |
            .ci-artifacts/${{ matrix.module }}/.vitest-reports/
            .ci-artifacts/${{ matrix.module }}/.ci-inventories/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage-merge:
    needs: unit-coverage
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Download coverage modules
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .ci-artifacts
          merge-multiple: true

      - name: Generate full test inventory
        run: >-
          node scripts/ci-metrics.mjs run full-test-inventory --
          sh -c 'pnpm exec vitest list --filesOnly --json > .ci-full-inventory.json'

      - name: Verify every test file ran exactly once
        run: >-
          node scripts/ci-metrics.mjs run validate-test-inventories --
          pnpm ci:validate-test-inventories .ci-full-inventory.json
          .ci-artifacts/.ci-inventories .ci-artifacts/.vitest-reports

      - name: Merge coverage and enforce thresholds
        run: >-
          node scripts/ci-metrics.mjs run merge-coverage --
          pnpm exec vitest --config=vitest.config.ts
          --merge-reports=.ci-artifacts/.vitest-reports --coverage

      - name: Measure failed coverage report
        if: ${{ !cancelled() && failure() }}
        run: >-
          node scripts/ci-metrics.mjs artifact coverage-report optional coverage/

      - name: Upload failed coverage report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [quality, tooling-tests, unit-coverage, coverage-merge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification dependency
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TOOLING_RESULT: ${{ needs['tooling-tests'].result }}
          UNIT_COVERAGE_RESULT: ${{ needs['unit-coverage'].result }}
          COVERAGE_MERGE_RESULT: ${{ needs['coverage-merge'].result }}
        run: |
          for result in "$QUALITY_RESULT" "$TOOLING_RESULT" "$UNIT_COVERAGE_RESULT" "$COVERAGE_MERGE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "verification dependency finished with: $result"
              exit 1
            fi
          done

  # 校验本次 PR 内所有提交是否符合 conventional commits(兜底本地 commit-msg 钩子被绕过的情况)。
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # push 到 main 时没有 PR 范围可校验,故只在 PR 上跑。
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint 需要 base..head 之间的完整提交历史。
          fetch-depth: 0

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >
          node scripts/ci-metrics.mjs run commitlint -- pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # web/admin E2E 独立执行，互不阻塞；最终由稳定的 e2e required check 汇总。
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      # 缓存 Playwright 浏览器二进制(按 Playwright 版本),避免每次跑都重新下载。
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @tsz/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Resolve Playwright cache key
        id: pw-key
        env:
          CACHE_KEY: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.value }}

      - name: Record Playwright cache
        run: >-
          node scripts/ci-metrics.mjs cache playwright-web
          "${{ steps.pw-key.outputs.value }}"
          "${{ steps.pw-cache.outputs.cache-matched-key }}"
          "${{ steps.pw-cache.outputs.cache-hit }}"
          "${{ steps.pw-cache.outcome }}"

      - name: Isolate failed Playwright restore
        if: steps.pw-cache.outcome == 'failure'
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright-fallback" >> "$GITHUB_ENV"

      # install 是幂等的：命中时只确认浏览器存在，miss/不完整缓存会补齐下载。
      - name: Ensure Playwright browsers
        run: >-
          node scripts/ci-metrics.mjs run playwright-browser --
          pnpm --filter @tsz/e2e exec playwright install chromium

      # 系统依赖走 apt,不随缓存走,每次都要重新拉 Ubuntu 源。该源偶发不可达时
      # install-deps 会一直卡住,直到吃满 job 的 timeout-minutes 被 cancel——
      # 表现为「跑了 20 分钟然后取消」,一个用例都没执行,极易被误判成用例挂了。
      # 因此:单次 4 分钟封顶 + 最多三次重试;三次都失败也不阻断,继续执行 e2e——
      # runner 镜像通常已含所需库,真缺库时让 e2e 以真实报错失败,比留下一个
      # 「超时取消」更好排查。
      - name: Install Playwright system deps
        run: |
          for i in 1 2 3; do
            if timeout 240 pnpm --filter @tsz/e2e exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps 第 $i 次失败或超时,15 秒后重试"
            sleep 15
          done
          echo "::warning::playwright install-deps 三次均失败,继续执行 e2e(runner 镜像通常已含所需库)"

      - name: Web E2E
        run: >-
          node scripts/ci-metrics.mjs run e2e-web --
          pnpm --filter @tsz/e2e test:e2e:web

      - name: Measure failed web Playwright report
        if: ${{ !cancelled() && failure() }}
        run: >-
          node scripts/ci-metrics.mjs artifact playwright-report-web optional
          e2e/playwright-report/

      # 失败时上传报告,便于排查 flaky 用例。
      - name: Upload web Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web
          path: e2e/playwright-report/
          retention-days: 7

      - name: Save Playwright cache from trusted main
        if: >-
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'LonelyFellas/tsz' &&
          steps.pw-cache.outcome == 'success' &&
          steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.value }}

  e2e-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and restore pnpm cache
        id: node-pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install
        run: >-
          node scripts/ci-metrics.mjs run install --
          pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @tsz/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Resolve Playwright cache key
        id: pw-key
        env:
          CACHE_KEY: playwright-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
        run: echo "value=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-key.outputs.value }}

      - name: Record Playwright cache
        run: >-
          node scripts/ci-metrics.mjs cache playwright-admin
          "${{ steps.pw-key.outputs.value }}"
          "${{ steps.pw-cache.outputs.cache-matched-key }}"
          "${{ steps.pw-cache.outputs.cache-hit }}"
          "${{ steps.pw-cache.outcome }}"

      - name: Isolate failed Playwright restore
        if: steps.pw-cache.outcome == 'failure'
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright-fallback" >> "$GITHUB_ENV"

      - name: Ensure Playwright browsers
        run: >-
          node scripts/ci-metrics.mjs run playwright-browser --
          pnpm --filter @tsz/e2e exec playwright install chromium

      - name: Install Playwright system deps
        run: |
          for i in 1 2 3; do
            if timeout 240 pnpm --filter @tsz/e2e exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps 第 $i 次失败或超时,15 秒后重试"
            sleep 15
          done
          echo "::warning::playwright install-deps 三次均失败,继续执行 e2e(runner 镜像通常已含所需库)"

      - name: Admin E2E
        run: >-
          node scripts/ci-metrics.mjs run e2e-admin --
          pnpm --filter @tsz/e2e test:e2e:admin

      - name: Measure failed admin Playwright report
        if: ${{ !cancelled() && failure() }}
        run: >-
          node scripts/ci-metrics.mjs artifact playwright-report-admin optional
          e2e/playwright-report-admin/

      - name: Upload admin Playwright report
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-admin
          path: e2e/playwright-report-admin/
          retention-days: 7

  e2e:
    needs: [e2e-web, e2e-admin]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both E2E suites
        env:
          WEB_E2E_RESULT: ${{ needs['e2e-web'].result }}
          ADMIN_E2E_RESULT: ${{ needs['e2e-admin'].result }}
        run: |
          for result in "$WEB_E2E_RESULT" "$ADMIN_E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "E2E dependency finished with: $result"
              exit 1
            fi
          done
