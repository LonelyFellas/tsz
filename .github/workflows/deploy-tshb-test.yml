name: Deploy tshb-test

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

# Do not discard a newer commit when an older CI completes out of order.
concurrency:
  group: deploy-tshb-test
  queue: max

jobs:
  deploy:
    if: >-
      github.repository == 'LonelyFellas/tsz' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the gate from this trusted workflow revision. An older candidate
          # may predate the gate entirely; eligible candidates must match below.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check deployment candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_EXPECTED_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_EXPECTED_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEPLOY_AUTO_SKIP_STALE: "1"
        run: |
          set -euo pipefail
          source deploy/deploy-source.sh
          deploy_candidate_checkpoint before-setup
          [[ "$(git rev-parse HEAD)" = "$DEPLOY_EXPECTED_SHA" ]]
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Setup Node and pnpm
        if: steps.candidate.outputs.current == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Install contract generator dependencies
        if: steps.candidate.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure SSH
        if: steps.candidate.outputs.current == 'true'
        env:
          DEPLOY_SSH_HOST: ${{ secrets.TSHB_TEST_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.TSHB_TEST_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.TSHB_TEST_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.TSHB_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          [[ "$DEPLOY_SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ && "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_SSH_KNOWN_HOSTS" ]]
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/tshb-test-key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tshb-test-key" "$HOME/.ssh/known_hosts"
          printf 'Host tshb-test\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/tshb-test-key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  BatchMode yes\n  ConnectTimeout 10\n  ControlMaster auto\n  ControlPersist 60\n  ControlPath "%s"\n' "$DEPLOY_SSH_HOST" "$DEPLOY_SSH_USER" "$HOME/.ssh/tsz-deploy-control" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          printf 'DEPLOY_SSH_CONTROL_PATH=%s\n' "$HOME/.ssh/tsz-deploy-control" >> "$GITHUB_ENV"

      - name: Deploy verified CI packages
        if: steps.candidate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_EXPECTED_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_EXPECTED_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DEPLOY_AUTO_CONFIG: "1"
          DEPLOY_SELECT_COMPONENTS: "1"
          DEPLOY_AUTO_SKIP_STALE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-composition"
          DEPLOY_COMPOSITION_STATE="$RUNNER_TEMP/deploy-composition/release-state.json" \
            ./deploy/deploy-composition.sh

      - name: Preserve release composition state
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-release-composition-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-composition/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Close deployment SSH connection
        if: ${{ always() }}
        run: |
          if [[ -n "${DEPLOY_SSH_CONTROL_PATH:-}" ]]; then
            ssh -S "$DEPLOY_SSH_CONTROL_PATH" -o BatchMode=yes -o ConnectTimeout=10 -O exit tshb-test >/dev/null 2>&1 || true
          fi
