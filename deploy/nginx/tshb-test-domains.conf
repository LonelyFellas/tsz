# tshb-test（47.121.142.19）HTTPS 域名入口。
# 部署位置：/etc/nginx/conf.d/tsz-test-domains.conf，由 deploy-web.sh / deploy-admin.sh
# 与 tsz.conf 一并 rsync 覆盖并 reload——服务器上的手工改动会在下次部署时被覆盖，改配置走 PR。
#
# 分流：
#   test.tianshengzhi.com        C 端 web —— /api/v1/* -> tsz-rust(127.0.0.1:8383)，其余 -> Next(127.0.0.1:3000)
#   admin-test.tianshengzhi.com  平台后台 admin —— /api/v1/* 同上，其余 -> 静态 SPA(/opt/tsz-admin/dist)
#   两个域名的 80 口 301 到 https。
#
# 证书由 certbot（authenticator/installer 均为 nginx）签发与续期，标注 managed by Certbot 的行
# 是它安装时写入的：续期不改本文件，但若在服务器重跑 certbot --nginx，要把改动同步回这里。
# gzip 指令放 server 块内的原因见 tshb-test.conf 头注。

server {
    server_name test.tianshengzhi.com;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # API JSON 与 Next 未压缩的响应均来自反代上游，必须 gzip_proxied 才会压缩。
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/test.tianshengzhi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/test.tianshengzhi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name admin-test.tianshengzhi.com;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    root /opt/tsz-admin/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/test.tianshengzhi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/test.tianshengzhi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = test.tianshengzhi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name test.tianshengzhi.com;
    return 404; # managed by Certbot
}

server {
    if ($host = admin-test.tianshengzhi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin-test.tianshengzhi.com;
    return 404; # managed by Certbot
}
