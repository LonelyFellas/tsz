# tshb-test（47.121.142.19）当前原生栈的 nginx 入口配置。
# 部署位置：/etc/nginx/conf.d/tsz.conf（Ubuntu 默认 sites-enabled/default 已停用）。
#
# 分流（裸 IP 直访，未绑域名——绑域名前需完成 ICP 备案）：
#   :80    C 端 web —— /api/v1/* -> tsz-rust(127.0.0.1:8383)，其余 -> Next standalone(127.0.0.1:3000)
#   :8081  平台后台 admin —— /api/v1/* 同上，其余 -> 静态 SPA(/opt/tsz-admin/dist)
#   （8081 需在阿里云安全组放行；备案后两者迁子域名、同回 80/443）
#
# 同源反代让两端的 refresh HttpOnly cookie 天然生效，无需 CORS。
# 注意：conf.d/*.conf 位于 nginx http 块内，此文件不可出现 http{}；
# gzip 指令必须放 server 块内（Ubuntu 默认 nginx.conf 的 http 块已有 gzip on，同层撞重复）。
#
# 旧文件 conf.d/tsz.conf（Go + Docker 时代、域名分流版）已废弃，仅作历史参考。

# ---------- C 端 web（主入口） ----------
server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # API JSON 与 Next 未压缩的响应均来自反代上游，必须 gzip_proxied 才会压缩。
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next standalone（systemd tsz-web，只绑 127.0.0.1:3000）。
    # /api/v1 已在上面被截走，Next 的 rewrites 在生产不会被触发。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- 平台后台 admin ----------
server {
    listen 8081;
    server_name _;

    root /opt/tsz-admin/dist;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # vite 产物带内容 hash（assets/xxx-<hash>.js），可永久缓存；改版即换文件名。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：/login、/users 等前端路由都回到 index.html 由前端接管。
    # index.html 禁缓存，保证发版后浏览器立刻拿到新 hash 的资源清单。
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
