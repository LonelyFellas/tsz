# tshb-test（47.121.142.19）当前原生栈的 nginx 入口配置。
# 部署位置：/etc/nginx/conf.d/tsz.conf（Ubuntu 默认 sites-enabled/default 已停用）。
#
# 分流（裸 IP 直访，未绑域名——绑域名前需完成 ICP 备案）：
#   /api/v1/*  -> tsz-rust 后端（systemd 服务，监听 127.0.0.1:8383）
#   其余       -> admin 静态 SPA（/opt/tsz-admin/dist，vite build 产物）
#
# 同源反代让 refresh 的 HttpOnly cookie（path=/api/v1/admin）天然生效，无需 CORS。
# 注意：conf.d/*.conf 位于 nginx http 块内，此文件不可出现 http{}。
#
# 旧文件 conf.d/tsz.conf（Go + Docker 时代、域名分流版）已废弃，仅作历史参考。

server {
    listen 80 default_server;
    server_name _;

    # 传输压缩：admin 的 JS chunk 最大 ~410kB，测试机公网带宽受限，不压缩首屏明显变慢。
    # 放 server 块内：Ubuntu 默认 nginx.conf 的 http 块已有 gzip on，同层会撞重复指令。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    root /opt/tsz-admin/dist;
    index index.html;

    # 后端 API：proxy_pass 不带 URI，原样透传完整路径（后端路由挂载于 /api/v1）。
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # vite 产物带内容 hash（assets/xxx-<hash>.js），可永久缓存；改版即换文件名。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退：/login、/users 等前端路由都回到 index.html 由前端接管。
    # index.html 禁缓存，保证发版后浏览器立刻拿到新 hash 的资源清单。
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
